spring.application.name=api-gateway
spring.cloud.gateway.server.webflux.routes[0].id=example-service
spring.cloud.gateway.server.webflux.routes[0].uri=${DOWNSTREAM_URL:http://localhost:9000}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/service/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1
management.endpoints.web.exposure.include=health,info
