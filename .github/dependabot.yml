version: 2
updates:
  - package-ecosystem: maven
    directories:
      - /taskboard-api
      - /starters/*
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      spring-ecosystem:
        patterns:
          - "org.springframework*"
      test-dependencies:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    groups:
      actions:
        patterns:
          - "*"
