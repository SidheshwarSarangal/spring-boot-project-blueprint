name: Verify handbook and starters

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  handbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate documentation structure and links
        run: ./scripts/validate-handbook.sh
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: "**/*.md"

  external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check external documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml "./**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  starter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - taskboard-api
          - starters/api-gateway
          - starters/background-worker
          - starters/batch-application
          - starters/command-line-application
          - starters/event-driven-service
          - starters/graphql-api
          - starters/integration-service
          - starters/realtime-application
          - starters/web-application
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.project }}/pom.xml
      - name: Build and test
        run: ./mvnw --batch-mode clean verify
