name: Verify handbook and starters

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  handbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate documentation structure and links
        run: ./scripts/validate-handbook.sh

  starter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - taskboard-api
          - starters/api-gateway
          - starters/background-worker
          - starters/batch-application
          - starters/command-line-application
          - starters/event-driven-service
          - starters/graphql-api
          - starters/integration-service
          - starters/realtime-application
          - starters/web-application
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.project }}/pom.xml
      - name: Build and test
        run: ./mvnw --batch-mode clean verify
