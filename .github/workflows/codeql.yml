name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            taskboard-api/pom.xml
            starters/*/pom.xml
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Compile every runnable application
        shell: bash
        run: |
          projects=(
            taskboard-api
            starters/api-gateway
            starters/background-worker
            starters/batch-application
            starters/command-line-application
            starters/event-driven-service
            starters/graphql-api
            starters/integration-service
            starters/realtime-application
            starters/web-application
          )
          for project in "${projects[@]}"; do
            "$project/mvnw" --batch-mode --file "$project/pom.xml" clean package -DskipTests
          done
      - name: Analyze Java
        uses: github/codeql-action/analyze@v4
